<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Subway Seat Rush Simulator</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #2c3e50; color: white;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh; touch-action: none; user-select: none;
        }

        #gameContainer {
            position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 960px; height: 540px; aspect-ratio: 16/9;
        }

        canvas {
            display: block; width: 100%; height: 100%;
            background-color: #ecf0f1; border-radius: 4px;
            cursor: pointer; outline: none; touch-action: none;
        }

        /* OVERLAYS */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; 
            align-items: center; text-align: center;
            z-index: 20; padding: 20px 10px; box-sizing: border-box;
            overflow-y: auto; justify-content: center;
        }

        #customScreen { justify-content: flex-start; }
        .hidden { display: none !important; }

        h1 { font-size: 2rem; margin: 10px 0; color: #f1c40f; text-transform: uppercase; letter-spacing: 2px; }
        h2 { margin: 10px 0; font-size: 1.5rem; color: #bdc3c7; }
        
        /* INSTRUCTION BOX */
        .instruction-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px; border-radius: 10px;
            max-width: 600px; width: 90%;
            margin-bottom: 20px; text-align: left;
            font-size: 0.9rem; line-height: 1.5; color: #ecf0f1;
            border: 1px solid #7f8c8d;
        }
        .instruction-box b { color: #f1c40f; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }

        .btn {
            background: #3498db; border: none; padding: 10px 25px; color: white;
            font-size: 1rem; border-radius: 30px; cursor: pointer; font-weight: bold;
            pointer-events: auto; transition: transform 0.1s; font-family: inherit;
            white-space: nowrap; flex-shrink: 0;
        }
        .btn:active { transform: scale(0.95); }
        button:focus-visible, input:focus-visible, canvas:focus-visible { outline: 3px solid #f1c40f; outline-offset: 2px; }

        .btn-easy { background: #2ecc71; } .btn-med { background: #f39c12; } .btn-hard { background: #e74c3c; }
        .btn-custom { background: #9b59b6; border: 2px solid #8e44ad; }
        .btn-back { background: transparent; border: 2px solid #7f8c8d; color: #bdc3c7; }
        .btn-layout { background: #34495e; border: 1px solid #7f8c8d; font-size: 0.8rem; padding: 8px 15px; }
        .btn.selected { box-shadow: 0 0 0 3px white; transform: scale(1.05); }

        /* Custom UI */
        .save-manager {
            width: 100%; max-width: 500px; background: rgba(52, 73, 94, 0.8);
            border-radius: 8px; padding: 10px; margin-bottom: 15px;
            border: 1px solid #7f8c8d; box-sizing: border-box;
        }
        .save-input-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; width: 100%; }
        .save-input-row input { padding: 8px; border-radius: 4px; border:none; flex: 1; font-size: 1rem; min-width: 0; }
        .save-list-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2); padding: 8px; margin-bottom: 5px; border-radius: 4px;
        }
        .save-name { color: #f1c40f; font-weight: bold; font-size: 0.9rem; cursor: pointer; flex-grow: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }

        .import-manager {
            width: 100%; max-width: 500px; box-sizing: border-box; margin: 0 0 15px;
            display: flex; flex-direction: column; gap: 6px; align-items: stretch;
            padding: 10px; border-radius: 14px;
            background: rgba(80,227,189,0.06); border: 1px solid rgba(80,227,189,0.22);
        }
        .import-actions { display: flex; gap: 8px; align-items: stretch; }
        .import-btn {
            flex: 1; padding: 10px 15px; border-color: rgba(80,227,189,0.36);
            background: rgba(80,227,189,0.13); color: #73edcd; box-shadow: none;
        }
        .template-link {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            padding: 8px 12px; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px;
            color: #c7d2df; background: rgba(255,255,255,0.055); text-decoration: none;
            font-size: 0.76rem; font-weight: 800; white-space: nowrap;
        }
        .template-link:hover { color: white; background: rgba(255,255,255,0.09); }
        .import-hint { color: #91a2b8; font-size: 0.72rem; line-height: 1.3; text-align: left; }
        .import-status { min-height: 1.1em; color: #91a2b8; font-size: 0.72rem; line-height: 1.3; text-align: left; }
        .import-status.success { color: #73edcd; }
        .import-status.error { color: #ff9292; }

        .custom-container { display: flex; width: 100%; max-width: 600px; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
        .custom-col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 250px; width: 100%; }

        .scroll-area {
            width: 100%; max-height: 180px; overflow-y: auto;
            background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px;
            margin: 5px 0; scrollbar-width: thin;
        }
        .station-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; justify-content: center; width: 100%; }
        .station-row input { padding: 8px; border-radius: 4px; border: none; background: #ecf0f1; font-size: 14px; flex: 1; min-width: 60px; }
        .btn-icon { padding: 5px 12px; border-radius: 5px; cursor:pointer; font-weight:bold; border:none; color:white; font-size: 0.9rem; }
        .btn-remove { background: #e74c3c; width: 30px; }

        .color-picker-row {
            display: flex; gap: 15px; margin: 10px 0; flex-wrap: wrap; justify-content: center;
            background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; width: 100%; box-sizing: border-box;
        }
        .color-group { display: flex; flex-direction: column; align-items: center; }
        .color-group label { font-size: 0.8rem; color: #bdc3c7; margin-bottom: 2px; }
        input[type="color"] { border: none; width: 50px; height: 35px; cursor: pointer; background: none; }

        .top-controls { position: absolute; top: 15px; right: 15px; z-index: 30; }
        body.playing .top-controls { top: 42px; }
        .control-btn {
            background: rgba(255,255,255,0.2); border: 1px solid white; color: white;
            padding: 5px 12px; cursor: pointer; border-radius: 20px; font-weight: bold; font-size: 0.8rem;
        }

        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 0; box-sizing: border-box; z-index: 10; 
            display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; 
        }
        .hud-top {
            width: 100%; background: rgba(44, 62, 80, 0.95);
            border-bottom: 3px solid #34495e; padding: 5px 0; display: flex; justify-content: center;
        }
        .hud-bottom {
            width: 100%; background: rgba(44, 62, 80, 0.95);
            border-top: 3px solid #34495e; padding: 8px 15px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
        }
        .hud-interactive { pointer-events: auto; display: flex; align-items: center; gap: 8px; }
        .hud-label { font-size: 0.7rem; color: #bdc3c7; }
        .hud-value { font-size: 1.1rem; font-weight: bold; }
        
        #energyBarContainer { width: 120px; height: 12px; background: #555; border-radius: 6px; overflow: hidden; border: 1px solid #fff; }
        #energyFill { width: 100%; height: 100%; background: #2ecc71; transition: width 0.2s; }

        #routeContainer { width: 95%; height: 25px; display: flex; align-items: center; position: relative; margin-bottom: 2px; }
        #routeLine { width: 100%; height: 3px; background: #7f8c8d; position: absolute; top: 11px; z-index: 1; }
        .station-dot { width: 8px; height: 8px; background: #bdc3c7; border-radius: 50%; position: absolute; top: 8px; z-index: 2; transform: translateX(-50%); }
        #trainIcon { position: absolute; top: 0px; left: 0%; font-size: 16px; z-index: 3; transform: translateX(-50%); }
        .station-label { position: absolute; top: 20px; font-size: 10px; color: #95a5a6; transform: translateX(-50%); white-space: nowrap; text-shadow: 1px 1px 1px #000; }

        .hud-btn { padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; margin-left: 2px; }
        #speedBtn { background: #16a085; min-width: 45px; } 
        #giveSeatBtn { background: #8e44ad; animation: pulse 1s infinite; }
        #standBtn { background: #2980b9; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #pauseBtn { background: #e67e22; } #restartBtn { background: #c0392b; }
        
        #notification {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.95); color: white; padding: 10px 25px;
            border-radius: 5px; font-weight: bold; opacity: 0; transition: opacity 0.5s;
            pointer-events: none; z-index: 15; white-space: nowrap; font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #priorityEventCard {
            position: absolute; left: 18px; top: 76px; z-index: 16; width: min(285px, calc(100% - 36px));
            display: grid; grid-template-columns: 42px 1fr auto; gap: 9px; align-items: center;
            box-sizing: border-box; padding: 10px 12px; text-align: left;
            border: 1px solid rgba(255,200,87,.34); border-radius: 14px;
            background: rgba(7,17,31,.9); color: white; backdrop-filter: blur(14px);
            box-shadow: 0 14px 36px rgba(0,0,0,.3);
        }
        #priorityEventIcon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,200,87,.13); font-size: 1.45rem; }
        #priorityEventTitle { display: block; color: #fff1c9; font-size: .78rem; }
        #priorityEventHint { display: block; margin-top: 2px; color: #9fb0c4; font-size: .64rem; line-height: 1.3; }
        #priorityEventTimer { min-width: 34px; color: #ffc857; font-size: .86rem; font-weight: 900; text-align: right; }
        #priorityEventAction {
            grid-column: 2 / 4; width: 100%; padding: 7px 10px; border: 1px solid rgba(80,227,189,.35);
            border-radius: 9px; background: rgba(80,227,189,.15); color: #73edcd;
            font-family: inherit; font-size: .7rem; font-weight: 800; letter-spacing: .04em; cursor: pointer;
        }
        #priorityEventAction:hover { background: rgba(80,227,189,.23); }

        @media (max-width: 600px) {
            .hud-bottom { padding: 6px 8px; gap: 6px; }
            .hud-stats { gap: 8px !important; }
            .hud-interactive { gap: 4px; }
            #energyBarContainer { width: 76px; }
            .hud-btn { padding: 6px 8px; min-width: 34px; font-size: 0.78rem; }
            #speedBtn { min-width: 38px; }
            .station-label { font-size: 9px; }
            .top-controls { top: 8px; right: 8px; }
        }

        @media (max-height: 500px) {
            .overlay { justify-content: flex-start; padding: 6px 8px; }
            .overlay h1 { font-size: 1.45rem; margin: 2px 0 6px; }
            .instruction-box { padding: 8px 12px; margin-bottom: 5px; font-size: 0.76rem; line-height: 1.35; }
            .btn-group { margin-top: 4px; }
            .btn { padding: 7px 20px; font-size: 0.88rem; }
            #startScreen > p { margin-top: 5px !important; }
        }

        /* 2026 VISUAL REFRESH */
        :root {
            --ink-950: #07111f; --ink-900: #0b1728; --ink-800: #11233a;
            --line: rgba(255,255,255,0.12); --muted: #92a4bb; --text: #f5f8fc;
            --mint: #50e3bd; --mint-dark: #103c3a; --amber: #ffc857;
            --coral: #ff6b6b; --violet: #9b8cff; --glass: rgba(11,23,40,0.82);
        }
        body {
            background:
                radial-gradient(circle at 18% 12%, rgba(80,227,189,0.13), transparent 27%),
                radial-gradient(circle at 82% 82%, rgba(155,140,255,0.12), transparent 30%),
                linear-gradient(145deg, #07111f 0%, #0b1c31 55%, #07111f 100%);
            color: var(--text); letter-spacing: 0.01em;
        }
        #gameContainer {
            border-radius: 18px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.13);
            box-shadow: 0 32px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(80,227,189,0.05) inset;
        }
        canvas { border-radius: 18px; }
        .overlay {
            background:
                linear-gradient(rgba(7,17,31,0.94), rgba(7,17,31,0.97)),
                repeating-linear-gradient(135deg, transparent 0 32px, rgba(255,255,255,0.03) 33px 34px);
            color: var(--text); gap: 2px; overflow-x: hidden;
        }
        .overlay::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background:
                radial-gradient(circle at 15% 18%, rgba(80,227,189,0.16), transparent 24%),
                radial-gradient(circle at 88% 76%, rgba(155,140,255,0.13), transparent 27%);
        }
        .overlay > * { position: relative; z-index: 1; }
        .brand-lockup { display: flex; flex-direction: column; align-items: center; }
        .brand-badge, .panel-kicker, .result-kicker {
            display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px;
            border: 1px solid rgba(80,227,189,0.3); border-radius: 999px;
            color: var(--mint); background: rgba(80,227,189,0.08);
            font-size: 0.65rem; font-weight: 800; letter-spacing: 0.17em; text-transform: uppercase;
        }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px var(--mint); }
        h1 { color: var(--text); font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1; margin: 13px 0 8px; letter-spacing: 0.04em; }
        .tagline { margin: 0 0 14px; color: var(--muted); font-size: 0.88rem; letter-spacing: 0.13em; }
        h2 { color: var(--text); }
        .instruction-box {
            max-width: 660px; border: 1px solid var(--line); border-left: 3px solid var(--mint);
            background: linear-gradient(135deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
            box-shadow: 0 16px 40px rgba(0,0,0,0.22); color: #d8e2ef;
            padding: 14px 18px; border-radius: 12px; line-height: 1.55;
        }
        .instruction-box b { color: var(--mint); }
        .section-label { color: var(--muted); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
        .btn {
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 8px 22px rgba(0,0,0,0.22); transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.07); box-shadow: 0 12px 28px rgba(0,0,0,0.3); }
        .difficulty-group { gap: 12px; }
        .difficulty-btn { min-width: 138px; padding: 15px 28px 13px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
        .difficulty-btn::before { content: attr(data-icon); font-size: 0.62rem; letter-spacing: .1em; opacity: .72; }
        .btn-easy { background: linear-gradient(135deg, #1aa985, #38d6ad); color: #061a19; }
        .btn-med { background: linear-gradient(135deg, #d99425, #ffc857); color: #2d1a00; }
        .btn-hard { background: linear-gradient(135deg, #d94d5c, #ff7580); color: white; }
        .btn-custom { background: rgba(155,140,255,0.13); color: #c9c1ff; border-color: rgba(155,140,255,0.45); }
        .btn-secondary, .btn-back { background: rgba(255,255,255,0.06) !important; color: #c7d2df; border-color: var(--line); }
        .layout-switcher { width: auto; padding: 5px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.045); }
        .btn-layout { border: 0; border-radius: 9px; background: transparent; box-shadow: none; color: var(--muted); }
        .btn-layout.selected { background: rgba(80,227,189,0.16); color: var(--mint); box-shadow: 0 0 0 1px rgba(80,227,189,0.45) inset; transform: none; }
        .top-controls { top: 18px; right: 22px; }
        body.playing .top-controls { top: 64px; }
        .control-btn {
            background: rgba(7,17,31,0.64); border-color: rgba(255,255,255,0.17); color: #cbd6e4;
            backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(0,0,0,0.22);
        }
        .hud-top {
            width: calc(100% - 24px); margin: 12px; box-sizing: border-box;
            background: rgba(7,17,31,0.83); border: 1px solid var(--line); border-radius: 13px;
            padding: 8px 13px 12px; backdrop-filter: blur(14px); box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }
        #routeContainer { height: 28px; }
        #routeLine { height: 2px; background: linear-gradient(90deg, var(--mint), rgba(255,255,255,0.22)); }
        .station-dot { width: 7px; height: 7px; top: 9px; background: #d6e0ec; box-shadow: 0 0 0 3px rgba(214,224,236,0.12); }
        .station-dot.active { background: var(--amber); box-shadow: 0 0 0 4px rgba(255,200,87,.16), 0 0 14px rgba(255,200,87,.5); }
        #trainIcon { top: -3px; padding: 2px 5px; border-radius: 7px; background: var(--mint); color: #061a19; font-size: 13px; box-shadow: 0 0 18px rgba(80,227,189,0.45); }
        .station-label { top: 21px; color: #91a2b8; text-shadow: none; font-weight: 600; }
        .hud-bottom {
            width: calc(100% - 24px); margin: 12px; box-sizing: border-box;
            border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px;
            background: rgba(7,17,31,0.86); backdrop-filter: blur(14px); box-shadow: 0 14px 34px rgba(0,0,0,0.25);
        }
        .hud-stats { align-items: stretch; }
        .hud-stats > div { justify-content: center; min-height: 34px; padding: 0 10px; border-right: 1px solid var(--line); }
        .hud-stats > div:last-child { border-right: 0; }
        .hud-label { color: #7f91a9; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
        .hud-value { color: var(--text); }
        #energyBarContainer { width: 130px; height: 7px; border: 0; background: rgba(255,255,255,0.12); box-shadow: inset 0 1px 3px rgba(0,0,0,0.35); }
        #energyFill { background: linear-gradient(90deg, #18b98f, var(--mint)); box-shadow: 0 0 10px rgba(80,227,189,0.45); }
        .hud-btn { border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,0.08); color: white; box-shadow: none; }
        #speedBtn { background: rgba(80,227,189,0.14); color: var(--mint); }
        #pauseBtn { background: rgba(255,200,87,0.15); color: var(--amber); }
        #restartBtn { background: rgba(255,107,107,0.14); color: #ff9797; }
        #standBtn { background: rgba(67,154,255,0.17); color: #91c5ff; }
        #giveSeatBtn { background: rgba(155,140,255,0.2); color: #c7beff; }
        #notification {
            top: 78px; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 999px; font-size: .88rem; backdrop-filter: blur(12px); box-shadow: 0 12px 34px rgba(0,0,0,.3);
        }
        .save-manager, .color-picker-row, .scroll-area {
            background: rgba(255,255,255,0.055); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,0.16);
        }
        .save-manager { border-radius: 14px; }
        .scroll-area { box-sizing: border-box; }
        .save-input-row input, .station-row input {
            background: rgba(7,17,31,0.82); color: var(--text); border: 1px solid var(--line); outline: none;
        }
        .save-input-row input::placeholder { color: #66788e; }
        input[type="color"] { border-radius: 9px; }
        .modal-card {
            width: min(420px, 88%); padding: 32px; box-sizing: border-box;
            border: 1px solid var(--line); border-radius: 22px;
            background: linear-gradient(145deg, rgba(20,39,63,.96), rgba(8,20,36,.97));
            box-shadow: 0 35px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04) inset;
        }
        .modal-card h1 { font-size: 2rem; }
        .modal-icon { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 10px; border-radius: 17px; background: rgba(255,200,87,.13); color: var(--amber); font-weight: 900; font-size: 1.4rem; }
        .result-kicker { margin-bottom: 5px; }
        .stars { font-size: 3rem; color: var(--amber); filter: drop-shadow(0 8px 16px rgba(255,200,87,.22)); margin: 8px 0; }
        #resultBreakdown { color: #b4c1d1; line-height: 1.65; margin: 8px 0 20px; }
        * { scrollbar-color: rgba(80,227,189,.45) rgba(255,255,255,.04); }

        @media (max-width: 600px) {
            #gameContainer { border-radius: 0; border-left: 0; border-right: 0; }
            canvas { border-radius: 0; }
            .hud-top, .hud-bottom { width: calc(100% - 12px); margin: 6px; }
            .hud-top { padding: 6px 8px 10px; }
            .hud-bottom { padding: 6px; }
            .hud-stats > div { padding: 0 5px; }
            #energyBarContainer { width: 70px; }
            body.playing .top-controls { top: 51px; right: 7px; }
            #notification { top: 61px; max-width: 82%; white-space: normal; text-align: center; }
            #priorityEventCard { left: 6px; top: 62px; width: min(270px, calc(100% - 12px)); padding: 8px 9px; grid-template-columns: 36px 1fr auto; }
            #priorityEventIcon { width: 36px; height: 36px; font-size: 1.2rem; }
            .import-manager { max-width: min(500px, 94vw); }
        }
        @media (max-height: 500px) {
            #gameContainer, canvas { border: 0; border-radius: 0; }
            .overlay { gap: 0; padding: 5px 8px; }
            .brand-badge { padding: 3px 8px; }
            .tagline { margin-bottom: 5px; font-size: .7rem; }
            .instruction-box { padding: 7px 11px; margin-bottom: 3px; }
            .difficulty-btn { min-width: 110px; padding: 8px 18px; }
            .layout-switcher { padding: 2px; }
            .modal-card { padding: 20px; }
            #customScreen .save-manager { margin-bottom: 6px; padding: 6px; }
            #customScreen .import-manager { margin-bottom: 6px; padding: 6px 8px; }
            #customScreen .import-btn { padding: 7px 12px; }

</head>
<body>

<div id="gameContainer">
    <div class="top-controls">
        <button class="control-btn" onclick="toggleLanguage()" aria-label="Switch language / 切换语言">🌐 EN/中</button>
    </div>
    <canvas id="gameCanvas" width="960" height="540" tabindex="0" role="application" aria-label="Subway seat rush game"></canvas>
    <div id="notification" role="status" aria-live="polite"></div>
    <div id="priorityEventCard" class="hidden" role="status" aria-live="polite">
        <span id="priorityEventIcon" aria-hidden="true">👴</span>
        <span><strong id="priorityEventTitle"></strong><small id="priorityEventHint"></small></span>
        <span id="priorityEventTimer">10s</span>
        <button id="priorityEventAction" type="button" onclick="game.donateSeat()" data-i18n="priorityAction">YIELD NOW</button>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-top">
            <div id="routeContainer">
                <div id="routeLine"></div>
                <div id="trainIcon">🚆</div>
            </div>
        </div>
        <div class="hud-bottom">
            <div class="hud-stats" style="display:flex; gap: 15px;">
                <div style="display:flex; flex-direction:column;">
                    <span class="hud-label" data-i18n="energy">ENERGY</span>
                    <div id="energyBarContainer"><div id="energyFill"></div></div>
                </div>
                <div style="display:flex; flex-direction:column;">
                    <span class="hud-label" data-i18n="moral">MORAL</span>
                    <span id="moralValue" class="hud-value" style="color: #f1c40f;">100</span>
                </div>
                <div style="display:flex; flex-direction:column;">
                    <span class="hud-label" data-i18n="clash">CLASH</span>
                    <span id="clashValue" class="hud-value" style="color: #e74c3c;">0</span>
                </div>
            </div>

            <div class="hud-interactive">
                <button id="giveSeatBtn" class="hud-btn hidden" onclick="game.donateSeat()" data-i18n="btnGive">GIVE SEAT</button>
                <button id="standBtn" class="hud-btn hidden" onclick="game.leaveSeat()" data-i18n="btnStand">STAND</button>
                
                <div style="margin-right: 5px; text-align: right;">
                    <span class="hud-label" style="display:block;" data-i18n="time">TIME</span>
                    <span class="hud-value" id="timer">60s</span>
                </div>
                <button id="speedBtn" class="hud-btn" onclick="game.toggleSpeed()" aria-label="Change speed">1x</button>
                <button id="pauseBtn" class="hud-btn" onclick="game.togglePause()" aria-label="Pause">II</button>
                <button id="restartBtn" class="hud-btn" onclick="game.goToMenu()" aria-label="Return to menu">↻</button>

        </div>
    </div>

    <div id="startScreen" class="overlay">
        <div class="brand-lockup">
            <div class="brand-badge"><span class="live-dot"></span><span data-i18n="lineBadge">METRO LINE 01</span></div>
            <h1 data-i18n="title">Subway Seat Rush</h1>
            <p class="tagline" data-i18n="tagline">Race smart. Ride kind.</p>
        </div>
        
        <div class="instruction-box" id="instructionBox">
            </div>

        <div class="btn-group layout-switcher" style="margin: 5px 0;">
            <span style="display:flex; align-items:center; font-size:0.8rem; color:#bdc3c7; margin-right:5px;" data-i18n="layout">Layout:</span>
            <button id="l-auto" class="btn btn-layout selected" onclick="game.setLayout('auto')" aria-label="Automatic layout">Auto</button>
            <button id="l-land" class="btn btn-layout" onclick="game.setLayout('landscape')" aria-label="Landscape layout">↔</button>
            <button id="l-port" class="btn btn-layout" onclick="game.setLayout('portrait')" aria-label="Portrait layout">↕</button>
        </div>

        <p class="section-label" data-i18n="selectDiff" style="margin-top:10px; margin-bottom: 5px;">Select Difficulty</p>
        <div class="btn-group difficulty-group">
            <button class="btn btn-easy difficulty-btn" data-icon="01" onclick="game.start('easy')" data-i18n="easy">EASY</button>
            <button class="btn btn-med difficulty-btn" data-icon="02" onclick="game.start('medium')" data-i18n="medium">MEDIUM</button>
            <button class="btn btn-hard difficulty-btn" data-icon="03" onclick="game.start('hard')" data-i18n="hard">HARD</button>
        </div>
        <div class="btn-group">
            <button class="btn btn-custom" onclick="customMenu.open()" data-i18n="custom">CUSTOM</button>
        </div>

    <div id="customScreen" class="overlay hidden">

        <div class="save-manager">

        </div>

        <div class="import-manager">
            <input id="routeFileInput" type="file" accept=".csv,.tsv,.txt,.json,text/csv,text/tab-separated-values,text/plain,application/json" hidden
                onchange="customMenu.importFile(this.files[0]); this.value = ''">
            <div class="import-actions">
                <button class="btn import-btn" type="button" onclick="document.getElementById('routeFileInput').click()">
                    <span aria-hidden="true">📎</span> <span data-i18n="importStops">IMPORT STATIONS</span>
                </button>
                <a class="template-link" href="station-template.csv" download="station-template.csv">
                    <span aria-hidden="true">↓</span> <span data-i18n="downloadTemplate">CSV TEMPLATE</span>
                </a>
            </div>
            <span class="import-hint" data-i18n="importHint">CSV / TSV / TXT / JSON · 2–10 stops</span>
            <div id="importStatus" class="import-status" role="status" aria-live="polite"></div>

        <div class="custom-container">
            <div class="custom-col">
                <div class="btn-group" style="margin: 0; gap:5px; width:100%;">
                    <button id="c-easy" class="btn btn-layout" onclick="customMenu.setDiff('easy')" data-i18n="easy">EASY</button>
                    <button id="c-med" class="btn btn-layout selected" onclick="customMenu.setDiff('medium')" data-i18n="medium">MEDIUM</button>
                    <button id="c-hard" class="btn btn-layout" onclick="customMenu.setDiff('hard')" data-i18n="hard">HARD</button>
                </div>
                <div class="color-picker-row">
                    <div class="color-group"><label data-i18n="floorColor">Floor</label><input type="color" id="picker-floor" value="#dce8ef" onchange="customMenu.colors.floor = this.value"></div>
                    <div class="color-group"><label data-i18n="seatColor">Seat</label><input type="color" id="picker-seat" value="#8296aa" onchange="customMenu.colors.seat = this.value"></div>
                </div>
            </div>
            
            <div class="custom-col">
                <div style="font-size:0.8rem; color:#bdc3c7; width:100%; display:flex; justify-content:space-between; margin-bottom:2px;">
                    <span data-i18n="lblEN">Name (EN)</span><span data-i18n="lblZH">Name (ZH)</span>
                </div>
                <div class="scroll-area" id="stationList"></div>
                <button class="btn btn-icon" style="background:#2ecc71; width:100%; margin-top:2px;" onclick="customMenu.addStation()">+ <span data-i18n="addStop">Add Stop</span></button>
            </div>
        </div>

        <div class="btn-group" style="margin-top:15px; margin-bottom: 20px;">
            <button class="btn btn-back" onclick="customMenu.close()" data-i18n="back">BACK</button>
            <button class="btn" style="background:#f1c40f; color:#2c3e50;" onclick="customMenu.start()" data-i18n="start">START</button>
        </div>
    </div>

    <div id="pauseScreen" class="overlay hidden">
        <div class="modal-card">
            <div class="modal-icon">Ⅱ</div>
            <h1 data-i18n="paused">PAUSED</h1>
            <button class="btn" onclick="game.togglePause()" data-i18n="resume">RESUME</button>
            <button class="btn btn-secondary" style="margin-top:10px;" onclick="game.goToMenu()" data-i18n="menu">MENU</button>
        </div>
    </div>
    <div id="gameOverScreen" class="overlay hidden">
        <div class="modal-card result-card">
            <div class="result-kicker" data-i18n="tripReport">TRIP REPORT</div>
            <h1 id="resultTitle">TRIP COMPLETE</h1>
            <div class="stars" id="resultStars">⭐⭐⭐</div>
            <p id="resultBreakdown"></p>
            <button class="btn" onclick="game.goToMenu()" data-i18n="backMenu">BACK TO MENU</button>
        </div>
    </div>
</div>

<script>
/** LOCALIZATION */
const TEXT = {
