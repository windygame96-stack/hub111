        instructions: "<b>游戏指南:</b><br>1. 🔵 <b>移动:</b> WASD、方向键或点击/拖拽。<br>2. 💺 <b>体力:</b> 在耗尽前抢到绿色空座。<br>3. ♿ <b>爱心座:</b> 空着时仍为橙色，坐下扣30公德。<br>4. 💥 <b>碰撞:</b> 每次碰撞扣2点公德，并降低安全分。<br>5. 💜 <b>随机事件:</b> 特需乘客可能上车，请在倒计时结束前让座。",
        easy: "简单", medium: "普通", hard: "困难", custom: "自定义", energy: "体力", moral: "公德", clash: "碰撞", time: "剩余时间", paused: "暂停", resume: "继续",
        menu: "主菜单", backMenu: "返回主菜单", station: "站点", arrival: "即将到达", exhausted: "体力耗尽", safe: "安全抵达",
        collapsed: "你倒下了。", finalEnergy: "最终评分", sit: "坐下", walk: "行走", st: "站", end: "终点",
        customTitle: "路线编辑器", lblEN: "英文名", lblZH: "中文名", addStop: "添加站点", back: "返回", start: "开始行程",
        floorColor: "地板颜色", seatColor: "座位边框", layout: "布局:", btnSave: "保存", savedFiles: "存档列表:", load: "读取",
        immoral: "没公德！ 公德 -30", kind: "暖心让座，公德 +{value}", btnGive: "让座", btnStand: "起身", clashMsg: "撞到乘客，公德 -{value}",
        energyScore: "体力", moralScore: "公德", safetyScore: "安全", seatsScore: "抢座次数", nextRush: "空座出现，快抢！", routeStudio: "路线工作室", tripReport: "本次乘车报告",
        importStops: "导入站名附件", downloadTemplate: "下载 CSV 模板", importHint: "建议先下载模板，再上传 CSV / TSV / TXT / JSON · 支持 2–10 站", importSuccess: "已导入 {count} 个站点，可继续编辑。",
        importTooFew: "附件中至少需要 2 个有效站点。", importTooMany: "最多支持导入 10 个站点。", importTooLarge: "附件大小不能超过 256 KB。",
        importInvalid: "未能读取站名，请检查附件内容。", importUnsupported: "请上传 CSV、TSV、TXT 或 JSON 文件。",
        priorityNeedsSeat: "需要座位", priorityRule: "让座 +{reward} · 忽视 -{penalty} 公德", priorityBoarding: "正在上车", priorityWaiting: "等待让座", priorityFindingSeat: "正在寻找空座", priorityAction: "立即让座",
        giveSeatTo: "让座给{type} · {seconds}秒", priorityIgnored: "你没有让座，公德 -{value}", prioritySeated: "已有空座，无需让座。",
        kindActsScore: "主动让座", ignoredScore: "未让座事件"
    }
};

let CUR_LANG = navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
const CONFIG = {
    PLAYER_SPEED: 400, NPC_EXIT_SPEED: 100, ENERGY_MAX: 100, ENERGY_REGAIN: 2, CLASH_MORAL_PENALTY: 2,
    PRIORITY_REWARD: 15, PRIORITY_PENALTY: 15, PRIORITY_GRACE: 10,
    COLORS: { PLAYER: '#3498db', NPC: '#7f8c8d', NEEDY: '#9b59b6', SEAT_VACANT_A: '#2ecc71', SEAT_VACANT_B: '#00ff00', SEAT_PRIORITY: '#e67e22', DOOR: '#95a5a6', DOOR_OPEN: '#f39c12', TARGET_RING: '#e74c3c' },
    FLOOR: '#dce8ef', SEAT_FRAME: '#8296aa'
};

const LEVELS = {
    easy:   { rushSpeed: 120, standingCount: 3, reactionDelay: 4, energyPressure: 1.15, clashPenalty: 4, priorityChance: 0.70 },
    medium: { rushSpeed: 170, standingCount: 15, reactionDelay: 2.2, energyPressure: 1.3, clashPenalty: 5, priorityChance: 0.82 },
    hard:   { rushSpeed: 250, standingCount: 42, reactionDelay: 1, energyPressure: 1.5, clashPenalty: 7, priorityChance: 0.90 }
};

const PRIORITY_PASSENGERS = [
    { id: 'elder', icon: '👴', color: '#c18b68', en: 'Senior rider', zh: '老人', enArrival: 'A senior rider is walking slowly into the carriage.', zhArrival: '一位老人缓慢走进车厢。' },
    { id: 'pregnant', icon: '🤰', color: '#d98eb4', en: 'Pregnant rider', zh: '孕妇', enArrival: 'A pregnant rider is looking for a safe place to sit.', zhArrival: '一位孕妇上车，正在寻找座位。' },
    { id: 'injured', icon: '🩼', color: '#8c9dd6', en: 'Injured rider', zh: '伤病乘客', enArrival: 'An injured rider boards with a walking aid.', zhArrival: '一位行动不便的伤病乘客上车了。' },
    { id: 'parent', icon: '👩‍🍼', color: '#a789d4', en: 'Parent with baby', zh: '抱婴家长', enArrival: 'A parent carrying a baby needs a steadier ride.', zhArrival: '一位抱着婴儿的家长上车了。' }
];

// HELPER
const rnd = (min, max) => Math.random() * (max - min) + min;
const checkCircleRect = (c, r) => {
    let tx = Math.max(r.x, Math.min(c.x, r.x + r.w));
    let ty = Math.max(r.y, Math.min(c.y, r.y + r.h));
    return ((c.x - tx) ** 2 + (c.y - ty) ** 2) <= c.r ** 2;
};
const getDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const roundedRect = (ctx, x, y, w, h, r) => {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
};

function toggleLanguage() {
    CUR_LANG = (CUR_LANG === 'en') ? 'zh' : 'en';
    updateText();
}

function updateText() {
    const t = TEXT[CUR_LANG];
    document.documentElement.lang = CUR_LANG === 'zh' ? 'zh-CN' : 'en';
    document.title = CUR_LANG === 'zh' ? '地铁抢座大作战' : 'Subway Seat Rush Simulator';
    document.getElementById('gameCanvas').setAttribute('aria-label', CUR_LANG === 'zh' ? '地铁抢座游戏区域' : 'Subway seat rush game');
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if(t[key]) el.innerText = t[key];
    });
    document.getElementById('instructionBox').innerHTML = t.instructions;
    if(game.isRunning) { game.rebuildRouteUI(); game.refreshPriorityEventUI(); }
    if(!document.getElementById('customScreen').classList.contains('hidden')) customMenu.renderInputs();
    customMenu.renderImportStatus();
}

// --- CUSTOM MENU ---
const customMenu = {
    stops: [], diff: 'medium', colors: { floor: '#dce8ef', seat: '#8296aa' }, saves: [], importState: null,
    init() {
        const storedSaves = localStorage.getItem('subway_saves');
        if(storedSaves) {
            try {
                const parsed = JSON.parse(storedSaves);
                if(Array.isArray(parsed)) this.saves = parsed.filter(s => s && Array.isArray(s.stops)).slice(0, 20);
            } catch(e) {}
        }
        this.resetToDefault();
    },
    resetToDefault() {
        this.stops = [{en: "Civic Ctr", zh: "市民中心"}, {en: "Union Sq", zh: "联合广场"}, {en: "Chinatown", zh: "唐人街"}, {en: "Terminal", zh: "终点站"}];
        this.diff = 'medium'; this.colors = { floor: '#dce8ef', seat: '#8296aa' };
    },
    open() {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('customScreen').classList.remove('hidden');
        this.importState = null;
        this.refreshUI();
    },
    close() {
        document.getElementById('customScreen').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
    },
    refreshUI() {
        this.setDiff(this.diff);
        document.getElementById('picker-floor').value = this.colors.floor;
        document.getElementById('picker-seat').value = this.colors.seat;
        this.renderInputs(); this.renderSaves(); this.renderImportStatus();
    },
    setDiff(d) {
        this.diff = d;
        ['c-easy', 'c-med', 'c-hard'].forEach(id => document.getElementById(id).classList.remove('selected'));
        if(d==='easy') document.getElementById('c-easy').classList.add('selected');
        if(d==='medium') document.getElementById('c-med').classList.add('selected');
        if(d==='hard') document.getElementById('c-hard').classList.add('selected');
    },
    saveProfile() {
        const name = document.getElementById('saveNameInput').value.trim() || ("Route " + (this.saves.length + 1));
        const profile = { name, stops: JSON.parse(JSON.stringify(this.stops)), diff: this.diff, colors: {...this.colors} };
        const existing = this.saves.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
        if(existing >= 0) this.saves[existing] = profile;
        else this.saves.unshift(profile);
        this.saves = this.saves.slice(0, 20);
        try { localStorage.setItem('subway_saves', JSON.stringify(this.saves)); } catch(e) {}
        this.renderSaves();
    },
    loadProfile(index) {
        const s = this.saves[index];
        this.stops = JSON.parse(JSON.stringify(s.stops)); this.diff = s.diff; this.colors = {...s.colors};
        this.refreshUI();
    },
    deleteProfile(index) {
        this.saves.splice(index, 1);
        try { localStorage.setItem('subway_saves', JSON.stringify(this.saves)); } catch(e) {}
        this.renderSaves();
    },
    renderSaves() {
        const list = document.getElementById('saveList'); list.innerHTML = '';
        this.saves.forEach((s, i) => {
            const row = document.createElement('div'); row.className = 'save-list-row';
            const name = document.createElement('button');
            name.type = 'button'; name.className = 'save-name';
            name.style.background = 'none'; name.style.border = 'none';
            name.textContent = `${s.name} (${s.stops.length} ${CUR_LANG === 'zh' ? '站' : 'Stops'})`;
            name.addEventListener('click', () => this.loadProfile(i));
            const remove = document.createElement('button');
            remove.type = 'button'; remove.className = 'btn-icon btn-remove'; remove.textContent = 'X';
            remove.setAttribute('aria-label', CUR_LANG === 'zh' ? `删除路线 ${s.name}` : `Delete route ${s.name}`);
            remove.addEventListener('click', () => this.deleteProfile(i));
            row.append(name, remove);
            list.appendChild(row);
        });
    },
    renderInputs() {
        const list = document.getElementById('stationList'); list.innerHTML = '';
        this.stops.forEach((stop, i) => {
            const row = document.createElement('div'); row.className = 'station-row';
            const index = document.createElement('span');
            index.style.cssText = 'color:#f1c40f;font-weight:bold;font-size:0.8rem'; index.textContent = i + 1;
            const enInput = document.createElement('input');
            enInput.type = 'text'; enInput.value = stop.en; enInput.maxLength = 24;
            enInput.setAttribute('aria-label', `Stop ${i + 1} English name`);
            enInput.addEventListener('change', e => this.update(i, 'en', e.target.value));
            const zhInput = document.createElement('input');
            zhInput.type = 'text'; zhInput.value = stop.zh; zhInput.maxLength = 24;
            zhInput.setAttribute('aria-label', `第 ${i + 1} 站中文名`);
            zhInput.addEventListener('change', e => this.update(i, 'zh', e.target.value));
            const remove = document.createElement('button');
            remove.type = 'button'; remove.className = 'btn btn-icon btn-remove'; remove.textContent = 'X';
            remove.disabled = this.stops.length <= 2;
            remove.setAttribute('aria-label', CUR_LANG === 'zh' ? `删除第 ${i + 1} 站` : `Remove stop ${i + 1}`);
            remove.addEventListener('click', () => this.remove(i));
            row.append(index, enInput, zhInput, remove);
            list.appendChild(row);
        });
    },
    setImportStatus(key, type = 'error', values = {}) {
        this.importState = { key, type, values };
        this.renderImportStatus();
    },
    renderImportStatus() {
        const status = document.getElementById('importStatus');
        if(!status) return;
        if(!this.importState) {
            status.textContent = '';
            status.className = 'import-status';
            return;
        }
        let message = TEXT[CUR_LANG][this.importState.key] || '';
        Object.entries(this.importState.values).forEach(([key, value]) => {
            message = message.replace(`{${key}}`, value);
        });
        status.textContent = message;
        status.className = `import-status ${this.importState.type}`;
    },
    parseDelimited(text, delimiter) {
        const rows = []; let row = []; let field = ''; let quoted = false;
        for(let i = 0; i < text.length; i++) {
            const char = text[i];
            if(char === '"') {
                if(quoted && text[i + 1] === '"') { field += '"'; i++; }
                else quoted = !quoted;
            } else if(char === delimiter && !quoted) {
                row.push(field); field = '';
            } else if((char === '\n' || char === '\r') && !quoted) {
                if(char === '\r' && text[i + 1] === '\n') i++;
                row.push(field); field = '';
                if(row.some(cell => String(cell).trim())) rows.push(row);
                row = [];
            } else field += char;
        }
        row.push(field);
        if(row.some(cell => String(cell).trim())) rows.push(row);
        return rows;
    },
    normalizeStops(rows) {
        const clean = value => String(value ?? '').replace(/^\uFEFF/, '').trim().slice(0, 24);
        const pick = (source, keys) => {
            for(const key of keys) if(source[key] !== undefined && clean(source[key])) return clean(source[key]);
            return '';
        };
        return rows.map(item => {
            let en = '', zh = '';
            if(typeof item === 'string' || typeof item === 'number') en = zh = clean(item);
            else if(Array.isArray(item)) { en = clean(item[0]); zh = clean(item[1] ?? item[0]); }
            else if(item && typeof item === 'object') {
                const source = {};
                Object.entries(item).forEach(([key, value]) => source[clean(key).toLowerCase()] = value);
                en = pick(source, ['en', 'english', 'name_en', 'en_name', '英文', '英文名']);
                zh = pick(source, ['zh', 'cn', 'chinese', 'name_zh', 'zh_name', '中文', '中文名']);
                const shared = pick(source, ['name', 'station', 'station_name', '站名', '站点']);
                en ||= shared; zh ||= shared;
            }
            en ||= zh; zh ||= en;
            return en && zh ? { en, zh } : null;
        }).filter(Boolean);
    },
    rowsFromDelimited(text, delimiter) {
        const rows = this.parseDelimited(text, delimiter);
        if(!rows.length) return [];
        const canonical = value => String(value ?? '').replace(/^\uFEFF/, '').trim().toLowerCase().replace(/[\s-]+/g, '_');
        const headers = rows[0].map(canonical);
        const enHeaders = ['en', 'english', 'name_en', 'en_name', '英文', '英文名'];
        const zhHeaders = ['zh', 'cn', 'chinese', 'name_zh', 'zh_name', '中文', '中文名'];
        const sharedHeaders = ['name', 'station', 'station_name', '站名', '站点'];
        const enIndex = headers.findIndex(value => enHeaders.includes(value));
        const zhIndex = headers.findIndex(value => zhHeaders.includes(value));
        const sharedIndex = headers.findIndex(value => sharedHeaders.includes(value));
        const hasHeader = enIndex >= 0 || zhIndex >= 0 || sharedIndex >= 0;
        const dataRows = hasHeader ? rows.slice(1) : rows;
        if(!hasHeader) return dataRows;
        return dataRows.map(row => {
            const shared = sharedIndex >= 0 ? row[sharedIndex] : '';
            return { en: enIndex >= 0 ? row[enIndex] : shared, zh: zhIndex >= 0 ? row[zhIndex] : shared };
        });
    },
    async importFile(file) {
        if(!file) return;
        const extension = (file.name.split('.').pop() || '').toLowerCase();
        if(!['csv', 'tsv', 'txt', 'json'].includes(extension)) return this.setImportStatus('importUnsupported');
        if(file.size > 256 * 1024) return this.setImportStatus('importTooLarge');
        try {
            const text = (await file.text()).replace(/^\uFEFF/, '');
            let rows;
            if(extension === 'json') {
                const parsed = JSON.parse(text);
                rows = Array.isArray(parsed) ? parsed : (parsed && (parsed.stops || parsed.stations));
                if(!Array.isArray(rows)) throw new Error('JSON station list missing');
            } else if(extension === 'txt') {
                rows = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            } else {
                const delimiter = extension === 'tsv' ? '\t' : ',';
                rows = this.rowsFromDelimited(text, delimiter);
            }
            const imported = this.normalizeStops(rows);
            if(imported.length < 2) return this.setImportStatus('importTooFew');
            if(imported.length > 10) return this.setImportStatus('importTooMany');
            this.stops = imported;
            this.renderInputs();
            this.setImportStatus('importSuccess', 'success', { count: imported.length });
        } catch(error) {
            this.setImportStatus('importInvalid');
        }
    },
    update(i, l, v) { this.stops[i][l] = v; },
    addStation() { if(this.stops.length < 10) { this.stops.push({en: "Stop", zh: "站"}); this.renderInputs(); } },
    remove(i) { if(this.stops.length > 2) { this.stops.splice(i, 1); this.renderInputs(); } },
    start() {
        CONFIG.FLOOR = this.colors.floor; CONFIG.SEAT_FRAME = this.colors.seat;
        const dur = ((this.stops.length - 1) * 15) + 3;
        document.getElementById('customScreen').classList.add('hidden');
        game.start(this.diff, this.stops, dur);
    }
};

class Seat {
    constructor(id, x, y) { 
        this.id = id; this.x = x; this.y = y; this.w = 50; this.h = 50; 
        this.occupant = null; this.isVacant = false; this.flashTimer = 0; 
        this.isPriority = false; 
    }
    draw(ctx) {
        ctx.save();
        if(this.isVacant) {
            this.flashTimer += 0.2;
            ctx.fillStyle = this.isPriority ? CONFIG.COLORS.SEAT_PRIORITY : CONFIG.COLORS.SEAT_VACANT_A;
        } else if (this.isPriority) {
            ctx.fillStyle = CONFIG.COLORS.SEAT_PRIORITY; 
        } else {
            ctx.fillStyle = CONFIG.SEAT_FRAME;
        }
        ctx.shadowColor = 'rgba(5,15,28,0.28)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
        roundedRect(ctx, this.x, this.y, this.w, this.h, 11); ctx.fill();
        ctx.shadowColor = 'transparent';
        const cushion = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
        cushion.addColorStop(0, 'rgba(255,255,255,0.24)'); cushion.addColorStop(1, 'rgba(2,12,24,0.16)');
        ctx.fillStyle = cushion; roundedRect(ctx, this.x+5, this.y+5, this.w-10, this.h-10, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
        roundedRect(ctx, this.x+.5, this.y+.5, this.w-1, this.h-1, 11); ctx.stroke();
        if(this.isVacant) {
            const pulse = 0.65 + Math.sin(this.flashTimer) * 0.3;
            ctx.strokeStyle = `rgba(80, 227, 189, ${pulse})`;
            ctx.shadowColor = 'rgba(80,227,189,.55)'; ctx.shadowBlur = 12;
            ctx.lineWidth = 4; roundedRect(ctx, this.x + 2, this.y + 2, this.w - 4, this.h - 4, 9); ctx.stroke();
            ctx.shadowColor = 'transparent';
        }
        if(this.isPriority && !this.isVacant && !this.occupant) {
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.font = "20px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("♿", this.x + this.w/2, this.y + this.h/2 + 7);
        }
        if(this.isPriority && this.isVacant) {
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.font = "18px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("♿", this.x + this.w/2, this.y + this.h/2 + 6);
        }
        ctx.restore();
    }
}

class Actor {
    constructor(x, y, isPlayer) { 
        this.x = x; this.y = y; this.r = 14; 
        this.isPlayer = isPlayer; 
        this.isNeedy = false; this.needType = null; this.needTimer = 0; this.needResolved = false;
        this.seat = null; this.targetSeat = null; this.targetDoor = null; this.targetEntry = null; this.reactionTime = 0;
        this.isExiting = false; this.isDead = false; 
    }
    sit(seat) { this.seat = seat; seat.occupant = this; seat.isVacant = false; this.x = seat.x + seat.w/2; this.y = seat.y + seat.h/2; this.targetSeat = null; this.reactionTime = 0; }
    standUp() { if (this.seat) { this.seat.occupant = null; this.seat = null; } }
    exitTrain(tx, ty) {
        this.standUp(); this.isExiting = true; this.targetDoor = {x: tx, y: ty};
        const dx = tx - this.x, dy = ty - this.y; const len = Math.hypot(dx, dy);
        this.x += (dx/len) * 20; this.y += (dy/len) * 20;
    }
    draw(ctx) {
        if (this.isDead && !this.isPlayer) return;
        ctx.save();
        ctx.fillStyle = 'rgba(5,15,28,0.2)';
        ctx.beginPath(); ctx.ellipse(this.x, this.y + this.r + 4, this.r * .9, 5, 0, 0, Math.PI*2); ctx.fill();
        const baseColor = this.isPlayer ? CONFIG.COLORS.PLAYER : (this.isNeedy ? (this.needType?.color || CONFIG.COLORS.NEEDY) : CONFIG.COLORS.NPC);
        ctx.shadowColor = this.isPlayer ? 'rgba(52,152,219,.55)' : 'rgba(5,15,28,.28)'; ctx.shadowBlur = this.isPlayer ? 14 : 7;
        ctx.fillStyle = baseColor; roundedRect(ctx, this.x-10, this.y-2, 20, 19, 8); ctx.fill();
        ctx.beginPath(); ctx.arc(this.x, this.y-7, 9, 0, Math.PI*2); ctx.fill();
        ctx.shadowColor = 'transparent'; ctx.strokeStyle = this.isPlayer ? '#c8edff' : 'rgba(255,255,255,.78)'; ctx.lineWidth = 1.6;
        roundedRect(ctx, this.x-10, this.y-2, 20, 19, 8); ctx.stroke();
        ctx.beginPath(); ctx.arc(this.x, this.y-7, 9, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(this.x-3, this.y-10, 2.2, 0, Math.PI*2); ctx.fill();
        if(this.isNeedy) {
            ctx.fillStyle = 'rgba(7,17,31,.88)'; roundedRect(ctx, this.x + 7, this.y - 28, 25, 23, 8); ctx.fill();
            ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(this.needType?.icon || '♥', this.x + 19.5, this.y - 11);
        }
        if (this.isPlayer) {
            const label = this.seat ? TEXT[CUR_LANG].sit : TEXT[CUR_LANG].walk;
            ctx.font = "bold 9px sans-serif"; const labelW = ctx.measureText(label).width + 14;
            ctx.fillStyle = 'rgba(7,17,31,.82)'; roundedRect(ctx, this.x-labelW/2, this.y-31, labelW, 17, 8); ctx.fill();
            ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.fillText(label, this.x, this.y - 19);
        }
        ctx.restore();
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.keys = {}; this.pointer = {x:0, y:0, isDown:false, hasTarget:false};
        this.isRunning = false; this.layoutMode = 'auto'; 
        this.timeScale = 1; this.speedLevels = [1, 1.5, 2, 3]; this.speedIndex = 0;
        this.runId = 0; this.timers = new Set();
        window.addEventListener('resize', () => this.resize());
        setTimeout(() => { this.resize(); updateText(); }, 100);
        this.setupInputs();
        customMenu.init();
    }

    setLayout(mode) {
        this.layoutMode = mode;
        ['l-auto', 'l-land', 'l-port'].forEach(id => document.getElementById(id).classList.remove('selected'));
        if(mode === 'auto') document.getElementById('l-auto').classList.add('selected');
        if(mode === 'landscape') document.getElementById('l-land').classList.add('selected');
        if(mode === 'portrait') document.getElementById('l-port').classList.add('selected');
        this.resize();
    }

    resize() {
        const cw = document.body.clientWidth;
        const ch = document.body.clientHeight;
        const oldWidth = this.width || 960;
        const oldHeight = this.height || 540;
        if (this.layoutMode === 'landscape') this.isPortrait = false;
        else if (this.layoutMode === 'portrait') this.isPortrait = true;
        else this.isPortrait = ch > cw; 

        if (this.isPortrait) { this.width = 540; this.height = 960; } 
        else { this.width = 960; this.height = 540; }
        
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        const scale = Math.min(cw / this.width, ch / this.height);
        const container = document.getElementById('gameContainer');
        container.style.width = Math.floor(this.width * scale) + 'px';
        container.style.height = Math.floor(this.height * scale) + 'px';
        container.style.aspectRatio = this.width + '/' + this.height;
        this.scaleRatio = scale;

        if(this.isRunning) {
            const sx = this.width / oldWidth, sy = this.height / oldHeight;
            [this.player, ...this.npcs].forEach(actor => {
                if(actor && !actor.seat) {
                    actor.x = Math.max(20, Math.min(this.width - 20, actor.x * sx));
                    actor.y = Math.max(20, Math.min(this.height - 20, actor.y * sy));
                    if(actor.targetDoor) { actor.targetDoor.x *= sx; actor.targetDoor.y *= sy; }
                    if(actor.targetEntry) { actor.targetEntry.x *= sx; actor.targetEntry.y *= sy; }
                }
            });
            this.buildLevel(true);
        }
    }

    setupInputs() {
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(key)) e.preventDefault();
            if(key === 'p' && !e.repeat) this.togglePause();
            this.keys[key] = true;
        });
        window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);
        const updatePointer = (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.pointer.x = (e.clientX - rect.left) * (this.width / rect.width);
            this.pointer.y = (e.clientY - rect.top) * (this.height / rect.height);
        };
        this.canvas.addEventListener('pointerdown', e => { this.canvas.setPointerCapture(e.pointerId); updatePointer(e); this.pointer.isDown=true; this.pointer.hasTarget=true; });
        this.canvas.addEventListener('pointermove', e => { if(this.pointer.isDown) updatePointer(e); });
        this.canvas.addEventListener('pointerup', e => { this.canvas.releasePointerCapture(e.pointerId); this.pointer.isDown=false; });
        this.canvas.addEventListener('pointercancel', () => { this.pointer.isDown = false; this.pointer.hasTarget = false; });
        this.canvas.addEventListener('lostpointercapture', () => { this.pointer.isDown = false; });
    }

    schedule(fn, delay) {
        const id = setTimeout(() => { this.timers.delete(id); fn(); }, delay);
        this.timers.add(id); return id;
    }

    clearTimers() {
        this.timers.forEach(id => clearTimeout(id)); this.timers.clear();
    }

    goToMenu() {
        this.isRunning = false;
        this.runId++; this.clearTimers();
        document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
        document.getElementById('notification').style.opacity = 0;
        this.hidePriorityEvent();
        document.body.classList.remove('playing');
    }

    toggleSpeed() {
        this.speedIndex = (this.speedIndex + 1) % this.speedLevels.length;
        this.timeScale = this.speedLevels[this.speedIndex];
        document.getElementById('speedBtn').innerText = this.timeScale + "x";
    }

    start(difficulty, routeList, duration) {
        this.clearTimers();
        this.currentLevel = LEVELS[difficulty];
        this.moral = 100;
        this.clashCount = 0;
        this.seatsWon = 0;
        this.kindActs = 0; this.ignoredPriority = 0;
        this.activePriorityPassenger = null; this.nearbyNeedy = null; this.lastPriorityType = null;
        this.notificationToken = (this.notificationToken || 0) + 1;
        this.hidePriorityEvent();
        this.clashCooldown = 0;
        this.seatCooldown = 0;
        this.speedIndex = 0; this.timeScale = 1; 
        document.getElementById('speedBtn').innerText = "1x";

        if(!routeList) { 
            CONFIG.FLOOR = '#dce8ef'; CONFIG.SEAT_FRAME = '#8296aa';
            this.route = [
                { name_en: "Civic Ctr", name_zh: "市民中心" },
                { name_en: "Union Sq", name_zh: "联合广场" },
                { name_en: "Chinatown", name_zh: "唐人街" },
                { name_en: "Terminal", name_zh: "终点站" }
            ];
            this.totalDuration = 60;
        } else {
            this.route = routeList.map(s => ({ name_en: s.en || s.name_en, name_zh: s.zh || s.name_zh }));
            this.totalDuration = duration;
        }
        this.finalDwellDuration = Math.min(3, this.totalDuration * 0.2);
        this.travelDuration = this.totalDuration - this.finalDwellDuration;
        this.triggers = this.route.slice(1).map((s, idx) => {
            const stationIndex = idx + 1;
            const progress = stationIndex / (this.route.length - 1);
            return {...s, progress, t: this.totalDuration - (this.travelDuration * progress)};
        });

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        document.getElementById('giveSeatBtn').classList.add('hidden');
        document.getElementById('standBtn').classList.add('hidden');
        document.getElementById('pauseBtn').setAttribute('aria-label', 'Pause');
        document.body.classList.add('playing');
        this.isPaused = false; this.resize();
        this.keys = {}; this.pointer.isDown = false; this.pointer.hasTarget = false;
        this.seats = []; this.npcs = [];
        this.player = new Actor(this.width/2, this.height/2, true);
        this.energy = CONFIG.ENERGY_MAX; this.timeLeft = this.totalDuration;
        this.energyDrainRate = (CONFIG.ENERGY_MAX / this.totalDuration) * this.currentLevel.energyPressure;
        
        this.nextStationIndex = 0; this.isRunning = true; this.lastTime = performance.now();
        const runId = ++this.runId;
        this.doorsOpen = false;
        this.buildLevel(); this.spawnInitialNPCs(); this.rebuildRouteUI();
        requestAnimationFrame(t => this.loop(t, runId));
    }

    buildLevel(preserveActors = false) {
        const previousSeats = new Map((this.seats || []).map(s => [s.id, s]));
        const nextSeats = [];
        const placeSeat = (id, x, y) => {
            const seat = previousSeats.get(id) || new Seat(id, x, y);
            seat.x = x; seat.y = y; nextSeats.push(seat);
        };
        const w = 50, h = 50, sp = 10;
        if (!this.isPortrait) {
            const startX = 60; const midGap = 160;
            const rowY_Top = 110; 
            const rowY_Bot = 400; 
            const blockWidth = (6 * (w + sp)); 
            const totalContent = (blockWidth * 2) + midGap - sp; 
            const marginX = (this.width - totalContent) / 2;
            for(let i=0; i<24; i++) {
                let r = Math.floor(i / 12); let c = i % 12;
                let x = marginX + c * (w + sp);
                if (c >= 6) x += midGap;
                let y = (r === 0) ? rowY_Top : rowY_Bot;
                placeSeat(i, x, y);
            }
        } else {
            const midGap = 120; const spV = 8;
            const colX_Left = 40; const colX_Right = this.width - 40 - w;
            const startY = 85; 
            for(let i=0; i<24; i++) {
                let side = Math.floor(i / 12); let row = i % 12;
                let y = startY + row * (h + spV);
                if (row >= 6) y += midGap;
                let x = (side === 0) ? colX_Left : colX_Right;
                placeSeat(i, x, y);
            }
        }
        this.seats = nextSeats;
        [this.player, ...(this.npcs || [])].forEach(actor => {
            if(actor?.seat) {
                const seat = this.seats.find(s => s.id === actor.seat.id);
                if(seat) { actor.seat = seat; seat.occupant = actor; actor.x = seat.x + seat.w/2; actor.y = seat.y + seat.h/2; }
            }
        });
        if(this.player && !this.player.seat && !preserveActors) {
            this.player.x = this.width/2; this.player.y = this.height/2; 
        }
    }

    spawnInitialNPCs() {
        this.npcs = [];
        let all = [...this.seats];
        let pCount = Math.floor(rnd(3, 6));
        let pIndices = [];
        while(pIndices.length < pCount) {
            let r = Math.floor(Math.random() * 24);
            if(pIndices.indexOf(r) === -1) pIndices.push(r);
        }
        this.seats.forEach((s, i) => { if(pIndices.includes(i)) s.isPriority = true; });
        let vacantSeats;
        if(this.currentLevel === LEVELS.easy) {
            vacantSeats = [this.seats[5], this.seats[18]];
            all = all.filter(s => !vacantSeats.includes(s));
        } else {
            for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
            vacantSeats = all.splice(-2);
        }
        for(let i=0; i<all.length; i++) { const npc = new Actor(0,0,false); this.npcs.push(npc); npc.sit(all[i]); }
        const area = this.isPortrait ? {minX:120, maxX:400, minY:100, maxY:850} : {minX:50, maxX:900, minY:170, maxY:380};
        for(let i=0; i<this.currentLevel.standingCount; i++) { this.npcs.push(new Actor(rnd(area.minX, area.maxX), rnd(area.minY, area.maxY), false)); }
        vacantSeats.forEach(seat => { seat.isVacant = true; this.assignRushers(seat); });
    }

    rebuildRouteUI() {
        const c = document.getElementById('routeContainer');
        c.innerHTML = '<div id="routeLine"></div><div id="trainIcon">🚆</div>';
        const count = this.route.length;
        const activeIndex = Math.min(this.nextStationIndex || 0, count - 1);
        this.route.forEach((s, i) => {
            const pct = (i / (count - 1)) * 90 + 5; 
            const dot = document.createElement('div'); dot.className = 'station-dot' + (i === activeIndex ? ' active' : ''); dot.dataset.index = i; dot.style.left = pct + '%';
            c.appendChild(dot);
            const lbl = document.createElement('div'); lbl.className = 'station-label';
            lbl.innerText = (CUR_LANG === 'zh') ? s.name_zh : s.name_en;
            lbl.style.left = pct + '%';
            c.appendChild(lbl);
        });
    }

    togglePause() {
        if(!this.isRunning) return;
        this.isPaused = !this.isPaused;
        document.getElementById('pauseScreen').classList.toggle('hidden', !this.isPaused);
        document.getElementById('pauseBtn').setAttribute('aria-label', this.isPaused ? 'Resume' : 'Pause');
        if(!this.isPaused) this.lastTime = performance.now();
    }

    showNotification(text, color, duration = 1600) {
        const notif = document.getElementById('notification');
        notif.innerText = text; notif.style.background = color; notif.style.opacity = 1;
        const token = ++this.notificationToken;
        this.schedule(() => { if(token === this.notificationToken) notif.style.opacity = 0; }, duration);
    }

    // --- NEW: CLASH LOGIC ---
    resolveCollision(a, b) {
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy), minD = a.r + b.r;

        if (d < minD && d > 0.001) {
            // Push away
            const overlap = minD - d;
            const mx = (dx/d) * overlap/2, my = (dy/d) * overlap/2;
            a.x -= mx; a.y -= my; b.x += mx; b.y += my;

            // Clash Counting (Debounced)
            if((a.isPlayer || b.isPlayer) && this.clashCooldown <= 0) {
                this.clashCount++;
                this.moral = Math.max(0, this.moral - CONFIG.CLASH_MORAL_PENALTY);
                this.clashCooldown = 0.5; // 0.5s immunity
                this.showNotification(TEXT[CUR_LANG].clashMsg.replace('{value}', CONFIG.CLASH_MORAL_PENALTY), "#e74c3c", 800);
            }
        }
    }

    checkForNeedy() {
        if(!this.player.seat) {
            document.getElementById('giveSeatBtn').classList.add('hidden');
            document.getElementById('standBtn').classList.add('hidden');
            this.nearbyNeedy = null;
            return;
        }
        const candidate = this.activePriorityPassenger;
        const nearest = candidate && candidate.isNeedy && !candidate.seat && !candidate.targetSeat ? candidate : null;
        document.getElementById('giveSeatBtn').classList.toggle('hidden', !nearest);
        document.getElementById('standBtn').classList.remove('hidden');
        this.nearbyNeedy = nearest;
        if(nearest) {
            const type = CUR_LANG === 'zh' ? nearest.needType.zh : nearest.needType.en;
            const label = TEXT[CUR_LANG].giveSeatTo.replace('{type}', type).replace('{seconds}', Math.max(0, Math.ceil(nearest.needTimer)));
            document.getElementById('giveSeatBtn').innerText = label;
            document.getElementById('priorityEventAction').innerText = label;
        }
    }

    leaveSeat() {
        if(!this.player.seat) return;
        const seat = this.player.seat;
        this.player.standUp(); seat.isVacant = true;
        if(this.isPortrait) this.player.x = seat.x < this.width/2 ? seat.x + seat.w + 24 : seat.x - 24;
        else this.player.y = seat.y < this.height/2 ? seat.y + seat.h + 24 : seat.y - 24;
        this.seatCooldown = 0.6;
        this.assignRushers(seat);
        document.getElementById('giveSeatBtn').classList.add('hidden');
        document.getElementById('standBtn').classList.add('hidden');
    }

    donateSeat() {
        const active = this.activePriorityPassenger;
        const passenger = this.nearbyNeedy || (active && active.isNeedy && !active.seat && !active.targetSeat ? active : null);
        if(!this.player.seat || !passenger) return;
        const s = this.player.seat;
        this.player.standUp();
        passenger.targetEntry = null;
        passenger.targetSeat = s;
        passenger.sit(s);
        this.resolvePriorityEvent(passenger, 'yield');
        document.getElementById('giveSeatBtn').classList.add('hidden');
        document.getElementById('standBtn').classList.add('hidden');
    }

    hidePriorityEvent() {
        document.getElementById('priorityEventCard')?.classList.add('hidden');
    }

    refreshPriorityEventUI() {
        const passenger = this.activePriorityPassenger;
        const card = document.getElementById('priorityEventCard');
        if(!passenger || passenger.needResolved || passenger.isDead || passenger.seat) {
            card.classList.add('hidden'); return;
        }
        const t = TEXT[CUR_LANG];
        const label = CUR_LANG === 'zh' ? passenger.needType.zh : passenger.needType.en;
        const setText = (id, value) => { const el = document.getElementById(id); if(el.textContent !== value) el.textContent = value; };
        setText('priorityEventIcon', passenger.needType.icon);
        setText('priorityEventTitle', `${label} ${t.priorityNeedsSeat}`);
        setText('priorityEventHint', t.priorityRule.replace('{reward}', CONFIG.PRIORITY_REWARD).replace('{penalty}', CONFIG.PRIORITY_PENALTY));
        setText('priorityEventTimer', passenger.targetEntry ? t.priorityBoarding : (passenger.targetSeat ? t.priorityFindingSeat : (this.player?.seat ? `${Math.max(0, Math.ceil(passenger.needTimer))}s` : t.priorityWaiting)));
        const action = document.getElementById('priorityEventAction');
        const actionable = Boolean(this.player?.seat && !passenger.targetSeat);
        action.classList.toggle('hidden', !actionable);
        if(actionable) {
            const type = CUR_LANG === 'zh' ? passenger.needType.zh : passenger.needType.en;
            setText('priorityEventAction', t.giveSeatTo.replace('{type}', type).replace('{seconds}', Math.max(0, Math.ceil(passenger.needTimer))));
        }
        card.classList.remove('hidden');
    }

    resolvePriorityEvent(passenger, outcome) {
        if(!passenger || passenger.needResolved) return;
        passenger.needResolved = true; passenger.isNeedy = false;
        if(outcome === 'yield') {
            this.kindActs++;
            this.moral = Math.min(100, this.moral + CONFIG.PRIORITY_REWARD);
            this.showNotification(TEXT[CUR_LANG].kind.replace('{value}', CONFIG.PRIORITY_REWARD), '#1aae87', 2200);
        } else if(outcome === 'ignored') {
            this.ignoredPriority++;
            this.moral = Math.max(0, this.moral - CONFIG.PRIORITY_PENALTY);
            this.showNotification(TEXT[CUR_LANG].priorityIgnored.replace('{value}', CONFIG.PRIORITY_PENALTY), '#c94858', 2400);
        } else if(outcome === 'seated') {
            this.showNotification(TEXT[CUR_LANG].prioritySeated, '#298b78', 1400);
        }
        if(this.activePriorityPassenger === passenger) this.activePriorityPassenger = null;
        this.nearbyNeedy = null;
        this.hidePriorityEvent();
        document.getElementById('giveSeatBtn').classList.add('hidden');
    }

    updatePriorityEvent(dt) {
        const passenger = this.activePriorityPassenger;
        if(!passenger || passenger.needResolved || passenger.isDead) return;
        if(passenger.seat) return this.resolvePriorityEvent(passenger, 'seated');
        if(passenger.targetEntry || passenger.targetSeat) { this.refreshPriorityEventUI(); return; }

        const reserved = new Set(this.npcs.filter(n => n !== passenger && n.targetSeat).map(n => n.targetSeat));
        const freeSeat = this.seats.find(s => s.isVacant && !s.occupant && !reserved.has(s));
        if(freeSeat) {
            passenger.targetSeat = freeSeat; passenger.reactionTime = 0;
            this.refreshPriorityEventUI(); return;
        }
        if(this.player.seat) {
            passenger.needTimer = Math.max(0, passenger.needTimer - dt);
            if(passenger.needTimer <= 0) return this.resolvePriorityEvent(passenger, 'ignored');
        }
        this.refreshPriorityEventUI();
    }

    update(dt) {
        if(this.clashCooldown > 0) this.clashCooldown -= dt; // Countdown immunity
        if(this.seatCooldown > 0) this.seatCooldown -= dt;

        this.timeLeft = Math.max(0, this.timeLeft - dt);
        if (this.player.seat) {
            this.energy = Math.min(CONFIG.ENERGY_MAX, this.energy + CONFIG.ENERGY_REGAIN * dt);
        } else {
            this.energy = Math.max(0, this.energy - this.energyDrainRate * dt);
        }
        if (this.energy <= 0) return this.gameOver(false);
        if (this.timeLeft <= 0) return this.gameOver(true);
        if (this.nextStationIndex < this.triggers.length) {
            const st = this.triggers[this.nextStationIndex];
            if (this.timeLeft <= st.t) { this.triggerStationEvent(st); this.nextStationIndex++; }
        }

        if (!this.player.seat) {
            let dx = 0, dy = 0;
            if (this.keys['arrowup'] || this.keys['w']) dy = -1;
            if (this.keys['arrowdown'] || this.keys['s']) dy = 1;
            if (this.keys['arrowleft'] || this.keys['a']) dx = -1;
            if (this.keys['arrowright'] || this.keys['d']) dx = 1;
            if (dx || dy) {
                this.pointer.hasTarget = false;
                const l = Math.hypot(dx, dy);
                this.player.x += (dx/l) * CONFIG.PLAYER_SPEED * dt;
                this.player.y += (dy/l) * CONFIG.PLAYER_SPEED * dt;
            } else if (this.pointer.hasTarget) {
                const pdx = this.pointer.x - this.player.x, pdy = this.pointer.y - this.player.y;
                const d = Math.hypot(pdx, pdy);
                if (d > 5) {
                    this.player.x += (pdx/d) * CONFIG.PLAYER_SPEED * dt;
                    this.player.y += (pdy/d) * CONFIG.PLAYER_SPEED * dt;
                } else this.pointer.hasTarget = false;
            }
            this.player.x = Math.max(20, Math.min(this.width-20, this.player.x));
            this.player.y = Math.max(20, Math.min(this.height-20, this.player.y));
            this.seats.forEach(s => { 
                if(this.seatCooldown <= 0 && s.isVacant && !s.occupant && checkCircleRect(this.player, s)) {
                    this.player.sit(s);
                    this.pointer.hasTarget = false;
                    this.seatsWon++;
                    if(s.isPriority) {
                        this.moral = Math.max(0, this.moral - 30);
                        this.showNotification(TEXT[CUR_LANG].immoral, "#e74c3c", 2000);
                    }
                } 
            });
            this.npcs.forEach(n => { if(!n.seat && !n.isExiting) this.resolveCollision(this.player, n); });
        }

        this.npcs.forEach(n => {
            if (n.isDead || n.seat) return;
            let tx = n.x, ty = n.y, spd = 0;
            if (n.isExiting) {
                tx = n.targetDoor.x; ty = n.targetDoor.y; spd = CONFIG.NPC_EXIT_SPEED;
                if (Math.hypot(tx - n.x, ty - n.y) < 10) { n.isDead = true; return; }
            } else if (n.targetEntry) {
                tx = n.targetEntry.x; ty = n.targetEntry.y; spd = CONFIG.NPC_EXIT_SPEED;
                if (Math.hypot(tx - n.x, ty - n.y) < 10) {
                    n.x = tx; n.y = ty; n.targetEntry = null; return;
                }
            } else if (n.targetSeat) {
                if (!n.targetSeat.isVacant || n.targetSeat.occupant) { n.targetSeat = null; }
                else if (n.reactionTime > 0) { n.reactionTime -= dt; }
                else {
                    tx = n.targetSeat.x + n.targetSeat.w/2; ty = n.targetSeat.y + n.targetSeat.h/2;
                    spd = this.currentLevel.rushSpeed;
                    if (checkCircleRect(n, n.targetSeat)) { n.sit(n.targetSeat); return; }
                }
            }
            if (spd > 0) {
                const ndx = tx - n.x, ndy = ty - n.y;
                const d = Math.hypot(ndx, ndy);
                n.x += (ndx/d) * spd * dt; n.y += (ndy/d) * spd * dt;
            }
        });
        const standing = this.npcs.filter(n => !n.seat && !n.isExiting && !n.isDead && !n.targetSeat);
        for(let i=0; i<standing.length; i++) {
            for(let j=i+1; j<standing.length; j++) this.resolveCollision(standing[i], standing[j]);
        }
        this.npcs = this.npcs.filter(n => !n.isDead);
        this.updatePriorityEvent(dt);
        this.checkForNeedy();
        this.updateUI();
    }

    triggerStationEvent(st) {
        const stName = (CUR_LANG === 'zh') ? st.name_zh : st.name_en;
        document.querySelectorAll('.station-dot').forEach((dot, index) => dot.classList.toggle('active', index === this.nextStationIndex + 1));
        this.showNotification(`${TEXT[CUR_LANG].arrival}: ${stName} · ${TEXT[CUR_LANG].nextRush}`, "rgba(230, 126, 34, 0.96)", 2600);
        this.doorsOpen = true; this.schedule(() => this.doorsOpen = false, 4000);

        const shouldTriggerPriority = st.progress < 0.999 && !this.activePriorityPassenger && Math.random() < this.currentLevel.priorityChance;
        const seated = this.npcs.filter(n => n.seat);
        const count = shouldTriggerPriority ? 1 : Math.floor(rnd(3, 7));
        seated.sort(() => Math.random() - 0.5);
        seated.slice(0, count).forEach(n => {
            const s = n.seat;
            let dx, dy;
            if(this.isPortrait) {
                dx = (n.x < this.width/2) ? 0 : this.width; dy = this.height/2; 
            } else {
                dx = this.width/2; dy = (n.y < this.height/2) ? 0 : this.height; 
            }
            n.exitTrain(dx, dy);
            s.isVacant = true;
            this.assignRushers(s);
        });
        
        const enter = Math.floor(rnd(2, 5));
        let priorityType = null, prioritySlot = -1, priorityPassenger = null;
        if(shouldTriggerPriority) {
            const choices = PRIORITY_PASSENGERS.filter(type => type.id !== this.lastPriorityType);
            priorityType = choices[Math.floor(Math.random() * choices.length)];
            prioritySlot = Math.floor(Math.random() * enter);
            this.lastPriorityType = priorityType.id;
        }
        const incomingPassengers = [];
        for(let i=0; i<enter; i++) {
            let nx, ny, tx, ty;
            if(this.isPortrait) {
                const isLeft = Math.random()>0.5;
                nx = isLeft ? 10 : this.width-10; ny = this.height/2 + rnd(-20,20);
                tx = isLeft ? 120 : this.width-120; ty = ny;
            } else {
                const isTop = Math.random()>0.5;
                nx = this.width/2 + rnd(-20,20); ny = isTop ? 10 : this.height-10;
                tx = nx; ty = isTop ? 150 : this.height-150;
            }
            const n = new Actor(nx, ny, false);
            if(i === prioritySlot && priorityType) {
                n.isNeedy = true; n.needType = priorityType; n.needTimer = CONFIG.PRIORITY_GRACE;
                if(this.player.seat) {
                    if(this.isPortrait) {
                        tx = this.player.x < this.width/2 ? 125 : this.width - 125; ty = this.player.y;
                    } else {
                        tx = this.player.x; ty = this.player.y < this.height/2 ? 175 : this.height - 175;
                    }
                }
                priorityPassenger = n; this.activePriorityPassenger = n;
            }
            n.targetEntry = {x: tx, y: ty}; this.npcs.push(n); incomingPassengers.push(n);
        }
        if(priorityPassenger) {
            const reserved = new Set(this.npcs.filter(n => n.targetSeat).map(n => n.targetSeat));
            const openSeats = this.seats.filter(s => s.isVacant && !s.occupant && !reserved.has(s));
            const regularIncoming = incomingPassengers.filter(n => n !== priorityPassenger);
            openSeats.forEach((seat, index) => {
                const rider = regularIncoming[index];
                if(rider) { rider.targetSeat = seat; rider.reactionTime = 0; reserved.add(seat); }
            });
            this.refreshPriorityEventUI();
            this.schedule(() => {
                if(this.activePriorityPassenger === priorityPassenger && !priorityPassenger.needResolved) {
                    const message = CUR_LANG === 'zh' ? priorityPassenger.needType.zhArrival : priorityPassenger.needType.enArrival;
                    this.showNotification(`${priorityPassenger.needType.icon} ${message}`, priorityPassenger.needType.color, 2600);
                }
            }, 650);
        }
    }

    assignRushers(s) {
        const stand = this.npcs.filter(n => !n.seat && !n.isExiting && !n.targetSeat);
        stand.sort((a,b) => getDist(a, {x:s.x, y:s.y}) - getDist(b, {x:s.x, y:s.y}));
        for(let i=0; i<Math.min(stand.length, 1); i++) {
            stand[i].targetSeat = s; stand[i].reactionTime = this.currentLevel.reactionDelay + rnd(0, 0.35);
        }
    }

    draw() {
        this.ctx.clearRect(0,0,this.width, this.height);
        this.ctx.fillStyle = CONFIG.FLOOR;
        this.ctx.fillRect(0, 0, this.width, this.height);

        const ambient = this.ctx.createLinearGradient(0, 0, this.width, this.height);
        ambient.addColorStop(0, 'rgba(255,255,255,.34)');
        ambient.addColorStop(.5, 'rgba(224,235,245,.08)');
        ambient.addColorStop(1, 'rgba(45,68,91,.16)');
        this.ctx.fillStyle = ambient; this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(62,88,112,.08)'; this.ctx.lineWidth = 1;
        const grid = 48;
        for(let x=0; x<this.width; x+=grid) { this.ctx.beginPath(); this.ctx.moveTo(x,0); this.ctx.lineTo(x,this.height); this.ctx.stroke(); }
        for(let y=0; y<this.height; y+=grid) { this.ctx.beginPath(); this.ctx.moveTo(0,y); this.ctx.lineTo(this.width,y); this.ctx.stroke(); }
        const aisle = this.ctx.createLinearGradient(0, 0, this.isPortrait ? this.width : 0, this.isPortrait ? 0 : this.height);
        aisle.addColorStop(0, 'rgba(29,56,78,.04)'); aisle.addColorStop(.5, 'rgba(80,227,189,.07)'); aisle.addColorStop(1, 'rgba(29,56,78,.04)');
        this.ctx.fillStyle = aisle;
        if(this.isPortrait) { roundedRect(this.ctx, 135, 50, this.width-270, this.height-100, 28); this.ctx.fill(); }
        else { roundedRect(this.ctx, 35, 175, this.width-70, this.height-350, 28); this.ctx.fill(); }
        this.ctx.restore();

        this.ctx.fillStyle = this.doorsOpen ? CONFIG.COLORS.DOOR_OPEN : CONFIG.COLORS.DOOR;
        this.ctx.shadowColor = 'rgba(7,17,31,.2)'; this.ctx.shadowBlur = 10;
        if (this.isPortrait) {
            roundedRect(this.ctx, -8, this.height/2 - 62, 50, 124, 10); this.ctx.fill();
            roundedRect(this.ctx, this.width-42, this.height/2 - 62, 50, 124, 10); this.ctx.fill();
        } else {
            roundedRect(this.ctx, this.width/2 - 62, -8, 124, 50, 10); this.ctx.fill();
            roundedRect(this.ctx, this.width/2 - 62, this.height-42, 124, 50, 10); this.ctx.fill();
        }
        this.ctx.shadowColor = 'transparent';

        this.seats.forEach(s => s.draw(this.ctx));
        this.npcs.forEach(n => n.draw(this.ctx));
        this.player.draw(this.ctx);
        if (this.pointer.hasTarget) {
            this.ctx.beginPath(); this.ctx.arc(this.pointer.x, this.pointer.y, 18, 0, Math.PI*2);
            this.ctx.strokeStyle = 'rgba(80,227,189,.9)'; this.ctx.lineWidth = 2; this.ctx.stroke();
            this.ctx.beginPath(); this.ctx.arc(this.pointer.x, this.pointer.y, 5, 0, Math.PI*2);
            this.ctx.fillStyle = 'rgba(80,227,189,.9)'; this.ctx.fill();
            if(!this.player.seat) {
                this.ctx.beginPath(); this.ctx.moveTo(this.player.x, this.player.y); this.ctx.lineTo(this.pointer.x, this.pointer.y);
                this.ctx.setLineDash([7,7]); this.ctx.strokeStyle = "rgba(80,227,189,0.42)"; this.ctx.lineWidth=2; this.ctx.stroke(); this.ctx.setLineDash([]);
            }
        }
    }

    loop(ts, runId) {
        if(!this.isRunning || runId !== this.runId) return;
        let dt = (ts - this.lastTime)/1000; if(dt>0.1) dt=0.1; this.lastTime = ts;
        if(!this.isPaused) { this.update(dt * this.timeScale); this.draw(); }
        requestAnimationFrame(t => this.loop(t, runId));
    }

    updateUI() {
        document.getElementById('energyFill').style.width = this.energy + '%';
        document.getElementById('energyFill').style.backgroundColor = this.energy>30?'#2ecc71':'#e74c3c';
        document.getElementById('moralValue').innerText = this.moral;
        document.getElementById('clashValue').innerText = this.clashCount;
        document.getElementById('timer').innerText = Math.ceil(this.timeLeft) + 's';
        const traveled = Math.min(this.travelDuration, this.totalDuration - this.timeLeft);
        const p = (traveled / this.travelDuration) * 90 + 5;
        document.getElementById('trainIcon').style.left = p + '%';
    }

    gameOver(win) {
        this.isRunning = false;
        this.clearTimers();
        this.hidePriorityEvent();
        document.body.classList.remove('playing');
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        const t = TEXT[CUR_LANG];
        const title = document.getElementById('resultTitle');
        if(win) {
            // WEIGHTED SCORE LOGIC: Energy(60%) + Moral(20%) + Safety(20%)
            // Safety = 100 - (Clashes * 5)
            const safetyScore = Math.max(0, 100 - (this.clashCount * this.currentLevel.clashPenalty));
            const finalScore = (this.energy * 0.6) + (this.moral * 0.2) + (safetyScore * 0.2);
            
            let s = finalScore>=85?3:(finalScore>=50?2:1);
            
            title.innerText = t.safe; title.style.color = "#f1c40f";
            document.getElementById('resultStars').innerText = "⭐".repeat(s);
            
            const breakdown = document.getElementById('resultBreakdown');
            breakdown.replaceChildren();
            const score = document.createElement('strong'); score.textContent = `${t.finalEnergy}: ${Math.floor(finalScore)}`;
            const details = document.createElement('span');
            details.style.cssText = 'display:block;font-size:0.8rem;color:#95a5a6;margin-top:6px';
            details.textContent = `${t.energyScore}: ${Math.floor(this.energy)} | ${t.moralScore}: ${this.moral} | ${t.safetyScore}: ${Math.floor(safetyScore)} | ${t.seatsScore}: ${this.seatsWon} | ${t.kindActsScore}: ${this.kindActs} | ${t.ignoredScore}: ${this.ignoredPriority}`;
            breakdown.append(score, details);
        } else {
            title.innerText = t.exhausted; title.style.color = "#e74c3c";
            document.getElementById('resultStars').innerText = "☠️";
            document.getElementById('resultBreakdown').innerText = t.collapsed;
        }
    }
}
